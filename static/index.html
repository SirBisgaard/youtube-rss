<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube RSS</title>
<style>
  :root { color-scheme: light dark; --accent: #c4302b; }
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; }
  h1 { font-size: 1.5rem; }
  form { display: flex; gap: .5rem; }
  input { flex: 1; padding: .6rem; font-size: 1rem; }
  button { padding: .6rem 1rem; font-size: 1rem; background: var(--accent); color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: .6; }
  #result { margin-top: 1.5rem; word-break: break-all; }
  .error { color: var(--accent); }
</style>
</head>
<body>
<h1>YouTube channel → RSS</h1>
<form id="form">
  <input id="url" type="text" placeholder="https://www.youtube.com/@channel" required autofocus>
  <button id="go">Convert</button>
</form>
<div id="result"></div>
<script>
  const form = document.getElementById('form');
  const input = document.getElementById('url');
  const button = document.getElementById('go');
  const result = document.getElementById('result');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    button.disabled = true;
    result.textContent = 'Looking up…';
    result.className = '';
    try {
      const res = await fetch('/api/feed?url=' + encodeURIComponent(input.value));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      result.innerHTML = '';
      const a = document.createElement('a');
      a.href = data.feed_url;
      a.textContent = data.feed_url;
      const copy = document.createElement('button');
      copy.textContent = 'Copy';
      copy.style.marginLeft = '.5rem';
      copy.onclick = () => navigator.clipboard.writeText(data.feed_url).then(() => copy.textContent = 'Copied');
      result.append(a, copy);
    } catch (err) {
      result.textContent = err.message || 'Something went wrong.';
      result.className = 'error';
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
